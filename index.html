<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Last Finger</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 35%, #1c2545 0%, #090c18 45%, #03040a 100%);
      color: white;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    /* TOP */

    .top {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 20;
      pointer-events: none;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 5px;
      text-shadow: 0 0 20px rgba(255,255,255,.35);
    }

    #status {
      margin-top: 8px;
      font-size: 13px;
      color: #aeb7d8;
      letter-spacing: .5px;
    }

    /* ARENA */

    #arena {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      overflow: hidden;
    }

    /* FINGER */

    .finger {
      position: absolute;

      width: 78px;
      height: 78px;

      border-radius: 50%;

      transform:
        translate(-50%, -50%)
        scale(1);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 24px;
      font-weight: 900;

      background:
        radial-gradient(
          circle at 35% 30%,
          #ffffff 0%,
          #bcd5ff 8%,
          #557fff 42%,
          #2433aa 100%
        );

      border: 3px solid rgba(255,255,255,.9);

      box-shadow:
        0 0 15px rgba(77,121,255,.8),
        0 0 35px rgba(77,121,255,.5),
        inset 0 0 20px rgba(255,255,255,.35);

      pointer-events: none;

      transition:
        transform .15s ease,
        opacity .3s ease,
        filter .3s ease;
    }

    .finger::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2px solid rgba(95,145,255,.18);
      animation: ring 1.6s infinite;
    }

    @keyframes ring {
      0% {
        transform: scale(.8);
        opacity: .8;
      }

      100% {
        transform: scale(1.35);
        opacity: 0;
      }
    }

    /* RANDOM ACTIVE */

    .finger.active {
      transform:
        translate(-50%, -50%)
        scale(1.45);

      box-shadow:
        0 0 20px #fff,
        0 0 45px #648cff,
        0 0 90px rgba(70,110,255,.8);

      animation: activePulse .18s infinite alternate;
    }

    @keyframes activePulse {
      from {
        transform:
          translate(-50%, -50%)
          scale(1.30);
      }

      to {
        transform:
          translate(-50%, -50%)
          scale(1.58);
      }
    }

    /* LOSER */

    .finger.loser {
      background:
        radial-gradient(
          circle at 35% 30%,
          #ffffff 0%,
          #ffb0b0 8%,
          #ff3030 42%,
          #8c0000 100%
        );

      border-color: #fff;

      transform:
        translate(-50%, -50%)
        scale(1.65);

      box-shadow:
        0 0 20px #ff3b3b,
        0 0 50px #ff2020,
        0 0 100px rgba(255,0,0,.8);

      animation: loserShake .12s infinite alternate;
    }

    @keyframes loserShake {
      from {
        transform:
          translate(-52%, -50%)
          scale(1.58)
          rotate(-4deg);
      }

      to {
        transform:
          translate(-48%, -50%)
          scale(1.72)
          rotate(4deg);
      }
    }

    .finger.gone {
      opacity: 0;
      filter: blur(10px);

      transform:
        translate(-50%, -50%)
        scale(.1);
    }

    /* BUTTONS */

    #controls {
      position: absolute;
      left: 0;
      bottom: 45px;
      width: 100%;

      display: flex;
      justify-content: center;

      z-index: 50;

      pointer-events: none;
    }

    button {
      border: none;
      outline: none;

      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;

      color: white;

      padding: 18px 45px;

      border-radius: 18px;

      cursor: pointer;

      pointer-events: auto;

      background:
        linear-gradient(
          135deg,
          #5c7cff,
          #784dff
        );

      box-shadow:
        0 10px 35px rgba(80,80,255,.45),
        inset 0 1px 0 rgba(255,255,255,.35);

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }

    button:active {
      transform: scale(.93);
    }

    #start {
      min-width: 210px;
    }

    #ready {
      min-width: 210px;

      background:
        linear-gradient(
          135deg,
          #00c896,
          #00a5ff
        );

      box-shadow:
        0 10px 35px rgba(0,200,160,.35);
    }

    /* RESULT */

    #result {
      position: absolute;
      inset: 0;

      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(2,3,10,.75);
      backdrop-filter: blur(10px);

      opacity: 0;
      pointer-events: none;

      transition: opacity .35s ease;
    }

    #result.show {
      opacity: 1;
      pointer-events: auto;
    }

    .result-box {
      width: min(88%, 400px);

      padding: 35px 25px;

      border-radius: 28px;

      text-align: center;

      background:
        linear-gradient(
          145deg,
          rgba(30,36,70,.95),
          rgba(9,11,25,.97)
        );

      border: 1px solid rgba(255,255,255,.12);

      box-shadow:
        0 30px 100px rgba(0,0,0,.7);
    }

    .result-small {
      color: #9fa9cf;
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    #resultText {
      font-size: 34px;
      font-weight: 1000;
      color: #ff4545;

      text-shadow:
        0 0 20px rgba(255,40,40,.7);

      margin-bottom: 25px;
    }

    #again {
      width: 100%;
    }

    [hidden] {
      display: none !important;
    }

    /* PLAYER COUNTER */

    #counter {
      position: absolute;

      top: 85px;
      right: 18px;

      z-index: 30;

      padding: 8px 13px;

      border-radius: 20px;

      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.08);

      color: #aeb8dc;

      font-size: 12px;
      font-weight: bold;

      pointer-events: none;
    }

    /* DESKTOP */

    @media (min-width: 700px) {
      .finger {
        width: 90px;
        height: 90px;
      }

      .logo {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <div class="top">
    <div class="logo">LAST FINGER</div>
    <div id="status">START tugmasini bosing</div>
  </div>

  <div id="counter">0 / 8</div>

  <div id="arena"></div>

  <div id="controls">

    <button id="start">
      START
    </button>

    <button id="ready" hidden>
      TAYYOR
    </button>

  </div>

  <div id="result">

    <div class="result-box">

      <div class="result-small">
        THE LOSER IS
      </div>

      <div id="resultText">
        PLAYER 1
      </div>

      <button id="again">
        PLAY AGAIN
      </button>

    </div>

  </div>

</div>


<script>

  const arena = document.getElementById("arena");
  const startButton = document.getElementById("start");
  const readyButton = document.getElementById("ready");
  const againButton = document.getElementById("again");

  const statusText = document.getElementById("status");
  const counter = document.getElementById("counter");

  const result = document.getElementById("result");
  const resultText = document.getElementById("resultText");

  const MAX_PLAYERS = 8;

  /*
    GAME STATES

    idle      = START ko'rinadi
    placing   = barmoqlar qo'yiladi
    choosing  = random tanlayapti
    finished  = yutqazgan aniqlangan
  */

  let phase = "idle";

  /*
    pointerId -> player
  */

  const players = new Map();

  let playerNumber = 0;

  let selectedPlayer = null;

  let randomTimer = null;

  let round = 0;

  let audioContext = null;


  /* =========================
       AUDIO
  ========================= */

  function initAudio() {

    if (!audioContext) {

      audioContext =
        new (window.AudioContext ||
        window.webkitAudioContext)();

    }

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }
  }


  function tone(
    frequency,
    duration,
    type = "sine",
    volume = 0.06
  ) {

    if (!audioContext) return;

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type = type;

    oscillator.frequency.value =
      frequency;

    gain.gain.setValueAtTime(
      volume,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + duration
    );
  }


  function placeSound() {

    tone(520, .08, "sine", .05);

    setTimeout(() => {
      tone(720, .08, "sine", .035);
    }, 45);

  }


  function tickSound() {

    tone(
      250 + Math.random() * 250,
      .055,
      "square",
      .025
    );

  }


  function loseSound() {

    tone(420, .12, "sawtooth", .07);

    setTimeout(() => {
      tone(280, .14, "sawtooth", .07);
    }, 100);

    setTimeout(() => {
      tone(150, .35, "sawtooth", .08);
    }, 210);

  }


  /* =========================
       UI
  ========================= */

  function updateCounter() {

    counter.textContent =
      `${players.size} / ${MAX_PLAYERS}`;

  }


  function updateStatus() {

    if (phase === "placing") {

      if (players.size === 0) {

        statusText.textContent =
          "Barmoqlaringizni ekranga qo'ying";

      } else {

        statusText.textContent =
          `${players.size} ta barmoq qo'yildi • TAYYOR ni bosing`;

      }

    }

    if (phase === "choosing") {

      statusText.textContent =
        "TANLANMOQDA...";

    }

  }


  /* =========================
       START
  ========================= */

  function startGame() {

    initAudio();

    if (phase !== "idle") return;

    phase = "placing";

    startButton.hidden = true;

    readyButton.hidden = false;

    updateStatus();

  }


  /* =========================
       CREATE PLAYER
  ========================= */

  function createPlayer(e) {

    if (phase !== "placing") return;

    if (players.size >= MAX_PLAYERS) {

      statusText.textContent =
        "MAXIMUM 8 PLAYERS";

      return;

    }

    if (players.has(e.pointerId)) {
      return;
    }


    const element =
      document.createElement("div");

    element.className = "finger";

    const number =
      ++playerNumber;

    element.textContent =
      number;


    element.style.left =
      `${e.clientX}px`;

    element.style.top =
      `${e.clientY}px`;


    arena.appendChild(element);


    const player = {

      id: e.pointerId,

      number: number,

      element: element,

      x: e.clientX,

      y: e.clientY

    };


    players.set(
      e.pointerId,
      player
    );


    /*
      Kichkina kirish animatsiyasi
    */

    element.style.transform =
      "translate(-50%, -50%) scale(.2)";


    requestAnimationFrame(() => {

      element.style.transform =
        "translate(-50%, -50%) scale(1)";

    });


    placeSound();

    updateCounter();

    updateStatus();

  }


  /* =========================
       REMOVE PLAYER
  ========================= */

  function removePlayer(pointerId) {

    if (phase !== "placing") return;

    const player =
      players.get(pointerId);

    if (!player) return;


    player.element.remove();

    players.delete(pointerId);

    updateCounter();

    updateStatus();

  }


  /* =========================
       MOVE PLAYER
  ========================= */

  function movePlayer(e) {

    if (phase !== "placing") return;

    const player =
      players.get(e.pointerId);

    if (!player) return;


    player.x = e.clientX;
    player.y = e.clientY;


    player.element.style.left =
      `${e.clientX}px`;

    player.element.style.top =
      `${e.clientY}px`;

  }


  /* =========================
       TOUCH / POINTER
  ========================= */

  arena.addEventListener(
    "pointerdown",
    (e) => {

      e.preventDefault();

      createPlayer(e);

    },
    { passive: false }
  );


  arena.addEventListener(
    "pointermove",
    (e) => {

      e.preventDefault();

      movePlayer(e);

    },
    { passive: false }
  );


  arena.addEventListener(
    "pointerup",
    (e) => {

      e.preventDefault();

      removePlayer(e.pointerId);

    },
    { passive: false }
  );


  arena.addEventListener(
    "pointercancel",
    (e) => {

      e.preventDefault();

      removePlayer(e.pointerId);

    },
    { passive: false }
  );


  /* =========================
       READY
  ========================= */

  function readyGame() {

    if (phase !== "placing") return;

    if (players.size === 0) {

      statusText.textContent =
        "Avval kamida 1 ta barmoq qo'ying";

      return;

    }


    initAudio();


    phase = "choosing";

    readyButton.hidden = true;

    statusText.textContent =
      "TANLANMOQDA...";


    startRandom();

  }


  /* =========================
       RANDOM SELECTION
  ========================= */

  function startRandom() {

    const list =
      Array.from(players.values());


    if (list.length === 0) return;


    round = 0;

    selectedPlayer = null;


    function nextRound() {

      if (phase !== "choosing") {
        return;
      }


      list.forEach(player => {

        player.element.classList.remove(
          "active"
        );

      });


      let randomIndex =
        Math.floor(
          Math.random() * list.length
        );


      /*
        Ketma-ket bir xil chiqmasin
      */

      if (
        list.length > 1 &&
        selectedPlayer
      ) {

        while (
          list[randomIndex] === selectedPlayer
        ) {

          randomIndex =
            Math.floor(
              Math.random() * list.length
            );

        }

      }


      selectedPlayer =
        list[randomIndex];


      selectedPlayer.element.classList.add(
        "active"
      );


      tickSound();


      round++;


      /*
        Dastlab sekin,
        keyin juda tez
      */

      const speed =
        Math.max(
          55,
          230 - round * 5
        );


      /*
        35 ta aylanishdan keyin
        tanlov tugaydi
      */

      if (round >= 35) {

        setTimeout(() => {

          finishGame();

        }, 500);

        return;

      }


      randomTimer =
        setTimeout(
          nextRound,
          speed
        );

    }


    nextRound();

  }


  /* =========================
       FINISH
  ========================= */

  function finishGame() {

    if (phase !== "choosing") {
      return;
    }


    phase = "finished";


    clearTimeout(randomTimer);


    const loser =
      selectedPlayer;


    if (!loser) return;


    /*
      Boshqalarning animatsiyasini o'chirish
    */

    players.forEach(player => {

      player.element.classList.remove(
        "active"
      );

    });


    /*
      LOSER
    */

    loser.element.classList.add(
      "loser"
    );


    /*
      Qolganlar yo'qoladi
    */

    players.forEach(player => {

      if (player !== loser) {

        setTimeout(() => {

          player.element.classList.add(
            "gone"
          );

        }, 250);

      }

    });


    loseSound();


    statusText.textContent =
      `PLAYER ${loser.number} LOST!`;


    /*
      Result oynasi
    */

    setTimeout(() => {

      resultText.textContent =
        `PLAYER ${loser.number}`;

      result.classList.add("show");

    }, 900);

  }


  /* =========================
       RESET
  ========================= */

  function resetGame() {

    clearTimeout(randomTimer);


    phase = "idle";


    players.forEach(player => {

      player.element.remove();

    });


    players.clear();


    playerNumber = 0;

    selectedPlayer = null;

    round = 0;


    result.classList.remove(
      "show"
    );


    startButton.hidden = false;

    readyButton.hidden = true;


    statusText.textContent =
      "START tugmasini bosing";


    updateCounter();

  }


  /* =========================
       BUTTONS
  ========================= */

  startButton.addEventListener(
    "click",
    startGame
  );


  readyButton.addEventListener(
    "click",
    readyGame
  );


  againButton.addEventListener(
    "click",
    resetGame
  );


  /* =========================
       PREVENT SCROLL / ZOOM
  ========================= */

  document.addEventListener(
    "contextmenu",
    e => e.preventDefault()
  );


  document.addEventListener(
    "gesturestart",
    e => e.preventDefault()
  );


  updateCounter();

</script>

</body>
</html>
